# Final demo reuses Stage9/control. No crypto release gate or key changes.
services:
  web:
    environment:
      ML_MONITOR_MODE: DISABLED
      WEB_MQTT_ENABLED: '0'
  policy-worker:
    environment:
      POLICY_MODE: DRY_RUN
  tests:
    volumes:
      - alpha-control:/run/device-alpha:ro
      - beta-control:/run/device-beta:ro
      - gamma-control:/run/device-gamma:ro
