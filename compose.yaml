x-app: &app
  image: ${COMPOSE_PROJECT_NAME:-lightcrypto}-runtime
  build:
    context: .
    target: runtime
  init: true
  stop_signal: SIGINT
  stop_grace_period: 15s

x-db-environment: &db-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lightcrypto}:${POSTGRES_PASSWORD:?generate .env.compose}@postgres:5432/${POSTGRES_DB:-lightcrypto}

x-mqtt-environment: &mqtt-environment
  MQTT_HOST: broker
  MQTT_PORT: "8883"
  MQTT_CA_FILE: /run/lcm/ca.crt
  DEVICE_REGISTRY_FILE: /run/lcm/registry.json

services:
  storage-init:
    <<: *app
    user: "0:0"
    command: [python, -m, scripts.install_storage]
    volumes:
      - ${MONGO_SECURITY_DIR:?generate MongoDB credentials}:/input:ro
      - mongo-security:/out/mongo
      - relay-storage-security:/out/relay
      - web-storage-security:/out/web
      - test-storage-security:/out/tests

  mongo:
    image: mongo:8.0.17@sha256:9814652e33f0cf8b9fddea8b46dfc9d8e19b130dcfdd7b510ca58bb0d40c8b71
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/mongo/root.password
    volumes:
      - mongo-data:/data/db
      - mongo-security:/run/mongo:ro
      - ./deploy/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
      - ./deploy/mongo/health.js:/health.js:ro
      - ./deploy/mongo/retention.js:/retention.js:ro
      - ./deploy/mongo/upgrade_profiles.js:/upgrade_profiles.js:ro
    healthcheck:
      test: [CMD, mongosh, --quiet, --file, /health.js]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lightcrypto}
      POSTGRES_USER: ${POSTGRES_USER:-lightcrypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate .env.compose}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  broker:
    image: eclipse-mosquitto:2@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
    ports:
      - "127.0.0.1:${MQTT_BIND_PORT:-8883}:8883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - broker-security:/mosquitto/security:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: [CMD, mosquitto_pub, -o, /mosquitto/security/health.conf]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    depends_on:
      security-init:
        condition: service_completed_successfully

  security-init:
    <<: *app
    user: "0:0"
    command: [python, -m, scripts.install_security]
    volumes:
      - ${MQTT_SECURITY_DIR:?generate local security material}:/input:ro
      - broker-security:/out/broker
      - publisher-security:/out/publisher
      - receiver-security:/out/receiver
      - web-security:/out/web
      - smoke-security:/out/smoke
      - test-security:/out/tests
      - publisher-state:/out/publisher-state
      - smoke-state:/out/smoke-state

  init-db:
    <<: *app
    command: [python, -m, src.migrate]
    environment: *db-environment
    depends_on:
      postgres:
        condition: service_healthy

  receiver:
    <<: *app
    volumes:
      - receiver-security:/run/lcm:ro
    environment:
      <<: [*db-environment, *mqtt-environment]
      MQTT_USERNAME: receiver
      MQTT_PASSWORD_FILE: /run/lcm/receiver.password
      MQTT_CLIENT_ID: ${INGESTION_CLIENT_ID:-lightcrypto-ingestion}
      MAX_OUTBOX_PENDING: ${MAX_OUTBOX_PENDING:-100000}
      MQTT_READY_FILE: /tmp/mqtt-ready
    depends_on:
      init-db:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; raise SystemExit(not Path('/tmp/mqtt-ready').is_file())"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  outbox-relay:
    <<: *app
    command: [python, -m, src.outbox_relay]
    volumes:
      - relay-storage-security:/run/storage:ro
    environment:
      <<: *db-environment
      MONGO_PASSWORD_FILE: /run/storage/relay.password
      OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-0}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-12}
    depends_on:
      init-db:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import time; from pathlib import Path; p=Path('/tmp/relay-ready'); raise SystemExit(not p.exists() or time.time()-p.stat().st_mtime>30)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ml-model-init:
    <<: *app
    profiles: [ml-tools]
    image: ${COMPOSE_PROJECT_NAME:-lightcrypto}-ml
    build:
      context: .
      target: ml
    user: "0:0"
    command: [python, -m, scripts.install_ml_model]
    environment:
      ML_MODEL_ID: ${ML_MODEL_ID:-telemetry-statistical}
      ML_MODEL_VERSION: ${ML_MODEL_VERSION:-1.0.0}
    volumes:
      - ${ML_MODELS_DIR:-./.local-runtime/ml-models}:/input:ro
      - ml-models:/models

  ml-worker:
    <<: *app
    profiles: [ml]
    image: ${COMPOSE_PROJECT_NAME:-lightcrypto}-ml
    build:
      context: .
      target: ml
    command: [python, -m, src.classifier.ml.worker]
    cpus: 1
    mem_limit: 768m
    volumes:
      - ml-models:/models:ro
      - web-storage-security:/run/storage:ro
    environment:
      <<: *db-environment
      MONGO_PASSWORD_FILE: /run/storage/history.password
      ML_MODEL_ID: ${ML_MODEL_ID:-telemetry-statistical}
      ML_MODEL_VERSION: ${ML_MODEL_VERSION:-1.0.0}
      ML_ALLOW_RESEARCH: ${ML_ALLOW_RESEARCH:-0}
      ML_MODELS_DIR: /models
      ML_BATCH_SIZE: ${ML_BATCH_SIZE:-16}
    depends_on:
      init-db:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  demo-setup:
    <<: *app
    profiles: [demo, checks]
    command: [python, -m, scripts.seed_demo]
    environment:
      <<: *db-environment
      DEVICE_REGISTRY_FILE: /run/lcm/registry.json
    volumes:
      - receiver-security:/run/lcm:ro
    depends_on:
      security-init:
        condition: service_completed_successfully
      init-db:
        condition: service_completed_successfully

  publisher:
    <<: *app
    profiles: [demo]
    command: [python, -m, src.publisher.mqtt_pub]
    volumes:
      - publisher-security:/run/lcm:ro
      - publisher-state:/state
    environment:
      <<: *mqtt-environment
      MQTT_USERNAME: publisher
      MQTT_PASSWORD_FILE: /run/lcm/publisher.password
      PUBLISHER_STATE_FILE: /state/sequence.db
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-10}
    depends_on:
      receiver:
        condition: service_healthy
      demo-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    <<: *app
    profiles: [web]
    command: [python, -m, src.web.app, serve]
    volumes:
      - web-security:/run/lcm:ro
      - web-storage-security:/run/storage:ro
    environment:
      <<: [*db-environment, *mqtt-environment]
      MQTT_USERNAME: web
      MQTT_PASSWORD_FILE: /run/lcm/web.password
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?generate .env.compose}
      MONGO_PASSWORD_FILE: /run/storage/history.password
      WEB_MQTT_ENABLED: "1"
      WEB_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:${WEB_BIND_PORT:-5000}:5000"
    depends_on:
      init-db:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/login', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  smoke:
    <<: *app
    profiles: [checks]
    entrypoint: [python, -m, scripts.mqtt_smoke]
    command: []
    volumes:
      - smoke-security:/run/lcm:ro
      - smoke-state:/state
    environment:
      <<: [*db-environment, *mqtt-environment]
      MQTT_USERNAME: smoke
      MQTT_PASSWORD_FILE: /run/lcm/smoke.password
      PUBLISHER_STATE_FILE: /state/sequence.db
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-10}
    depends_on:
      demo-setup:
        condition: service_completed_successfully
      receiver:
        condition: service_healthy

  policy-worker:
    <<: *app
    profiles: [policy]
    command: [python, -m, src.policy.worker]
    environment:
      <<: *db-environment
      POLICY_MODE: DRY_RUN
      POLICY_BATCH_SIZE: ${POLICY_BATCH_SIZE:-32}
    cpus: "1.0"
    mem_limit: 256m
    depends_on:
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; p=pathlib.Path('/tmp/policy-ready'); assert p.exists() and time.time()-p.stat().st_mtime<30"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  tests:
    <<: *app
    profiles: [checks]
    image: ${COMPOSE_PROJECT_NAME:-lightcrypto}-tests
    build:
      context: .
      target: tests
    volumes:
      - test-security:/run/lcm:ro
      - smoke-state:/state
      - test-storage-security:/run/storage:ro
    environment:
      MONGO_PASSWORD_FILE: /run/storage/relay.password
      TEST_MONGO_ENABLED: "1"
      MQTT_CA_FILE: /run/lcm/ca.crt
      <<: *db-environment
      MQTT_HOST: broker
      MQTT_PORT: "8883"
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lightcrypto}:${POSTGRES_PASSWORD:?generate .env.compose}@postgres:5432/${POSTGRES_DB:-lightcrypto}
    depends_on:
      storage-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      security-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  mosquitto-data:
  broker-security:
  publisher-security:
  receiver-security:
  web-security:
  smoke-security:
  test-security:
  publisher-state:
  smoke-state:
  mongo-data:
  mongo-security:
  relay-storage-security:
  web-storage-security:
  test-storage-security:
  ml-models:
